  <g transform="translate(52 104) rotate(90)"><text x="0" y="14" font-size="40" text-anchor="middle" fill="#D6DAE0" font-family="'Frutiger', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">3.0</text></g>

  <!-- USB 3.0 -->
  <rect x="133" y="63" width="33" height="79" rx="3" fill="url(#metal)" stroke="#7C838C" stroke-width="1"/>
