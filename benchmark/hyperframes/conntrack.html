<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <!-- Local copies (see scripts/vendor.mjs) so nothing is fetched from a CDN at runtime. -->
    <script src="./vendor/gsap.min.js"></script>
    <script src="./vendor/hyperframe.runtime.iife.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; background: #f6f7f9; font-family: sans-serif; }
      #root { position: relative; width: 1280px; height: 720px; }
      .clip { position: absolute; inset: 0; visibility: hidden; }
      svg { display: block; width: 1280px; height: 720px; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="conntrack"
      data-start="0"
      data-duration="49.5"
      data-width="1280"
      data-height="720"
    >
      <div class="clip" data-start="0" data-duration="49.5" data-track-index="0">
        <svg id="scene" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </div>
    <script type="module">
      // Connection-table exhaustion: the cases are simulated once by buildScene() (see
      // benchmark/shared/conntrack-scene.js) and one linear GSAP tween drives the clock.
      // The timeline always has the longest length (every case on); the demo page plays
      // the part the config needs with the player's range-end.
      import { DEFAULTS, MAX_DURATION_S, buildScene, createRenderer, normalize } from "./vendor/conntrack-scene.js";

      const svg = document.getElementById("scene");
      const ROUTER_IMAGE = "/vector/cb3-back.svg";
      let cfg = DEFAULTS;
      let render = createRenderer(svg, buildScene(cfg), ROUTER_IMAGE);
      const clock = { t: 0 };
      const draw = () => render(clock.t);

      const tl = gsap.timeline({
        paused: true,
        // Benchmark instrumentation only: count rendered frames (no-op outside the harness).
        onUpdate: () => {
          try { (parent.__bench || window.__bench)?.frame?.(tl.time()); } catch (e) {}
        },
      });
      tl.to(clock, { t: MAX_DURATION_S, duration: MAX_DURATION_S, ease: "none", onUpdate: draw }, 0);

      window.__hyperframes?.registerRuntimeDataHandler?.("config", (next) => {
        cfg = normalize({ ...cfg, ...next });
        render = createRenderer(svg, buildScene(cfg), ROUTER_IMAGE);
        draw();
      });
      draw();

      window.__timelines = window.__timelines || {};
      window.__timelines["conntrack"] = tl;
    </script>
  </body>
</html>
