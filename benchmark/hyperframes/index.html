<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <!-- Local copies (see scripts/vendor.mjs) so nothing is fetched from a CDN at runtime. -->
    <script src="./vendor/gsap.min.js"></script>
    <script src="./vendor/hyperframe.runtime.iife.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #0e1116;
        font-family: sans-serif;
      }
      #root { position: relative; width: 1280px; height: 720px; --accent: #3d8bff; }
      .card {
        position: absolute; left: 80px; top: 80px; width: 1120px; height: 560px;
        border-radius: 24px; background: #171b22;
      }
      .clip { position: absolute; inset: 0; visibility: hidden; }
      #title {
        position: absolute; left: 120px; top: 110px; max-width: 1040px;
        font-size: 52px; font-weight: 600; line-height: 1; color: #e6eaf2;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        opacity: 0;
      }
      #gauge { position: absolute; inset: 0; opacity: 0; }
      #gauge svg { position: absolute; left: 0; top: 0; }
      #number {
        position: absolute; left: 180px; top: 350px; width: 400px; height: 120px;
        display: flex; justify-content: center; align-items: baseline; line-height: 120px;
      }
      #num { font-size: 104px; font-weight: 700; color: #fff; }
      #unit { font-size: 44px; font-weight: 600; color: var(--accent); }
      .bar {
        position: absolute; bottom: 140px; width: 56px; height: 320px;
        border-radius: 8px 8px 0 0; background: #232833;
      }
      .bar-fill {
        position: absolute; left: 0; bottom: 0; width: 100%;
        height: calc(320px * var(--target, 0) * var(--p, 0));
        border-radius: 8px 8px 0 0; background: var(--accent);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="status-card"
      data-start="0"
      data-duration="8"
      data-width="1280"
      data-height="720"
    >
      <div class="card"></div>
      <div id="content" class="clip" data-start="0" data-duration="8" data-track-index="0">
        <div id="title">System status</div>
        <div id="gauge">
          <svg width="1280" height="720" viewBox="0 0 1280 720">
            <circle cx="380" cy="410" r="150" fill="none" stroke="#2A2F3A" stroke-width="26" />
            <circle
              id="ring"
              cx="380" cy="410" r="150" fill="none"
              stroke="var(--accent)" stroke-width="26" stroke-linecap="round"
              stroke-dasharray="942.478" stroke-dashoffset="942.478"
              transform="rotate(-90 380 410)" opacity="0"
            />
            <g id="dot-arm">
              <circle id="dot" cx="380" cy="260" r="9" fill="#FFFFFF" opacity="0" />
            </g>
          </svg>
          <div id="number"><span id="num">0</span><span id="unit">%</span></div>
          <div class="bar" style="left: 700px"><div class="bar-fill"></div></div>
          <div class="bar" style="left: 792px"><div class="bar-fill"></div></div>
          <div class="bar" style="left: 884px"><div class="bar-fill"></div></div>
          <div class="bar" style="left: 976px"><div class="bar-fill"></div></div>
          <div class="bar" style="left: 1068px"><div class="bar-fill"></div></div>
        </div>
      </div>
    </div>
    <script>
      const CIRC = 2 * Math.PI * 150;
      const $ = (s) => document.querySelector(s);
      const root = $("#root");
      const fills = [...document.querySelectorAll(".bar-fill")];
      const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

      let cfg = {
        title: "System status",
        value: 78,
        unit: "%",
        accentColor: "#3D8BFF",
        bars: [30, 55, 80, 45, 65],
      };

      // Ring fill, end dot and count-up all derive from one tweened progress value,
      // so a config change only needs drawRing() and never touches the timeline.
      const ring = { fill: 0 };
      function drawRing() {
        const arc = ring.fill * (clamp(Number(cfg.value) || 0, 0, 100) / 100);
        const el = $("#ring");
        el.setAttribute("stroke-dashoffset", String(CIRC * (1 - arc)));
        el.setAttribute("opacity", arc > 0 ? "1" : "0");
        $("#dot-arm").setAttribute("transform", `rotate(${arc * 360} 380 410)`);
        $("#num").textContent = String(Math.round((Number(cfg.value) || 0) * ring.fill));
      }

      function applyConfig(next) {
        cfg = { ...cfg, ...next };
        root.style.setProperty("--accent", cfg.accentColor);
        $("#title").textContent = cfg.title;
        $("#unit").textContent = cfg.unit;
        fills.forEach((f, i) =>
          f.style.setProperty("--target", String(clamp(Number(cfg.bars?.[i]) || 0, 0, 100) / 100)),
        );
        drawRing();
      }

      const tl = gsap.timeline({
        paused: true,
        // Benchmark instrumentation only: count rendered frames (no-op outside the harness).
        onUpdate: () => {
          try { (parent.__bench || window.__bench)?.frame?.(); } catch (e) {}
        },
      });

      // Intro
      tl.fromTo("#title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 0.3);
      tl.fromTo("#gauge", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "none" }, 0.6);
      tl.fromTo(ring, { fill: 0 }, { fill: 1, duration: 2.0, ease: "power2.inOut", onUpdate: drawRing }, 0.8);
      fills.forEach((f, i) => {
        tl.fromTo(f, { "--p": 0 }, { "--p": 1, duration: 0.9, ease: "power2.out" }, 1.2 + i * 0.15);
      });

      // Hold: end-dot pulse, 9 -> 13 -> 9 twice (four sine half-cycles of 0.95 s)
      tl.fromTo("#dot", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 2.8);
      tl.fromTo("#dot", { attr: { r: 9 } }, { attr: { r: 13 }, duration: 0.95, ease: "sine.inOut", yoyo: true, repeat: 3 }, 2.8);

      // Outro
      tl.to("#content", { opacity: 0, duration: 1.0, ease: "power2.in" }, 6.6);
      tl.to("#title", { y: -20, duration: 1.0, ease: "power2.in" }, 6.6);
      tl.set({}, {}, 8); // pad the timeline to the full 8 s loop

      applyConfig(cfg);
      window.__hyperframes?.registerRuntimeDataHandler?.("config", applyConfig);

      window.__timelines = window.__timelines || {};
      window.__timelines["status-card"] = tl;
    </script>
  </body>
</html>
